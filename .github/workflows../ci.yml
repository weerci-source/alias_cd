name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov gcovr

    - name: Clone far2l SDK
      run: |
        git clone --depth 1 https://github.com/elfmz/far2l.git ../far2l

    - name: Cache GoogleTest
      uses: actions/cache@v3
      with:
        path: external
        key: ${{ runner.os }}-gtest-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-gtest-

    - name: Configure CMake
      run: |
        cmake -B build-coverage \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=ON \
              -DCMAKE_CXX_FLAGS="--coverage" \
              -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
              -DFAR2L_SDK_PATH=${{ github.workspace }}/../far2l/src/far2l/far2sdk

    - name: Build tests
      run: cmake --build build-coverage --target tests

    - name: Run tests
      run: ctest --test-dir build-coverage --output-on-failure

    - name: Generate coverage report
      run: |
        mkdir -p build-coverage/coverage_report
        gcovr --root . \
              --html --html-details -o build-coverage/coverage_report/index.html \
              --exclude '.*/tests/.*' \
              --exclude '.*/build-coverage/_deps/.*'
        gcovr --root . \
              --txt -o build-coverage/coverage_report.txt \
              --exclude '.*/tests/.*' \
              --exclude '.*/build-coverage/_deps/.*'

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build-coverage/coverage_report/